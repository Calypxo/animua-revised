<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <title>ANIMUA — Audit Trail</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/css/adminDashboard.css" />
  <link rel="stylesheet" href="/src/css/sidebar.css" />
  <link rel="stylesheet" href="/src/css/auditTrail.css" />
</head>
<body class="loading">
  <div class="shell">
    <div id="sidebar-container"></div>

    <div class="stage">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebarToggle" class="icon-btn"><i class="bi bi-list"></i></button>
          <nav class="d-flex align-items-center">
            <span class="breadcrumb-link">System</span>
            <i class="bi bi-chevron-right breadcrumb-sep"></i>
            <span class="breadcrumb-current">Audit Trail</span>
          </nav>
        </div>

        <div class="topbar-right">
          <button class="icon-btn notif-btn">
            <i class="bi bi-bell-fill"></i>
            <span class="notif-dot"></span>
          </button>

          <div class="user-chip">
            <div class="user-avatar" id="topbar-initials">AD</div>
            <div class="user-meta">
              <span id="display-name">Admin</span>
              <small id="display-role">Administrator</small>
            </div>
            <i class="bi bi-chevron-down caret"></i>
          </div>
        </div>
      </header>

      <div class="page-body">
        <div class="page-header mb-4">
          <div>
            <h1 class="page-title">Audit Trail</h1>
            <p class="page-sub">
              View recent system activities, staff actions, and affected records across the admin modules.
            </p>
          </div>

          <div class="d-flex gap-2 flex-wrap align-items-center">
            <button class="btn-outline-add" id="btnResetFilters">
              <i class="bi bi-arrow-counterclockwise"></i> Reset Filters
            </button>
            <button class="btn-primary-clay" id="btnExportAudit">
              <i class="bi bi-download"></i> Export Logs
            </button>
          </div>
        </div>

        <div id="auditAlertBar" class="mb-4"></div>

        <div class="panel audit-panel">
          <div class="panel-head flex-column gap-3">
            <div class="d-flex gap-2 flex-wrap align-items-center justify-content-between w-100">
              <div class="d-flex gap-2 flex-wrap">
                <div class="search-pill-sm">
                  <i class="bi bi-search"></i>
                  <input
                    type="text"
                    id="searchAudit"
                    placeholder="Search actor, action, module, record..."
                    autocomplete="off"
                  />
                </div>

                <select class="filter-select" id="filterModule">
                  <option value="">All modules</option>
                  <option value="Animal Management">Animal Management</option>
                  <option value="Adoption Management">Adoption Management</option>
                  <option value="Post Adoption">Post Adoption</option>
                  <option value="Inventory">Inventory</option>
                  <option value="User Management">User Management</option>
                  <option value="Authentication">Authentication</option>
                </select>

                <select class="filter-select" id="filterAction">
                  <option value="">All actions</option>
                  <option value="Created">Created</option>
                  <option value="Updated">Updated</option>
                  <option value="Deleted">Deleted</option>
                  <option value="Approved">Approved</option>
                  <option value="Logged In">Logged In</option>
                  <option value="Scheduled">Scheduled</option>
                </select>

                <select class="filter-select" id="filterStatus">
                  <option value="">All status</option>
                  <option value="Success">Success</option>
                  <option value="Warning">Warning</option>
                  <option value="Failed">Failed</option>
                </select>
              </div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="shelter-table">
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>Actor</th>
                  <th>Module</th>
                  <th>Action</th>
                  <th>Record</th>
                  <th>Status</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr>
                  <td colspan="7" class="text-center py-5">
                    <div class="um-spinner"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="um-pagination" id="paginationBar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="um-modal-backdrop" id="viewAuditModalBackdrop">
    <div class="um-modal audit-modal" role="dialog" aria-modal="true">
      <div class="um-modal-header">
        <div>
          <h2>Audit Log Details</h2>
          <p class="modal-subtitle">Detailed activity information</p>
        </div>
        <button class="modal-close-btn" id="viewAuditClose">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="um-modal-body">
        <div id="viewAuditContent"></div>
      </div>

      <div class="um-modal-footer">
        <button class="btn-outline-add" id="viewAuditCloseFooter">Close</button>
      </div>
    </div>
  </div>

  <div class="um-toast" id="umToast">
    <i class="bi" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/management/auditTrail.js"></script>
</body>
</html>
