<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMUA — Archived Records</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/css/adminDashboard.css" />
  <link rel="stylesheet" href="/src/css/sidebar.css" />
  <link rel="stylesheet" href="/src/css/archivedRecords.css" />
</head>
<body class="loading">
  <div class="shell">
    <div id="sidebar-container"></div>

    <div class="stage">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebarToggle" class="icon-btn"><i class="bi bi-list"></i></button>
          <nav class="d-flex align-items-center">
            <span class="breadcrumb-link">System</span>
            <i class="bi bi-chevron-right breadcrumb-sep"></i>
            <span class="breadcrumb-current">Archived Records</span>
          </nav>
        </div>

        <div class="topbar-right">
          <button class="icon-btn notif-btn">
            <i class="bi bi-bell-fill"></i>
            <span class="notif-dot"></span>
          </button>

          <div class="user-chip">
            <div class="user-avatar" id="topbar-initials">AD</div>
            <div class="user-meta">
              <span id="display-name">Admin</span>
              <small id="display-role">Administrator</small>
            </div>
            <i class="bi bi-chevron-down caret"></i>
          </div>
        </div>
      </header>

      <div class="page-body">
        <div id="pageHeaderMount"></div>

        <div id="archiveAlertBar" class="mb-4"></div>

        <div class="panel archive-panel">
          <div class="panel-head flex-column gap-3">
            <div class="archive-tabs" id="archiveTabs">
              <button class="archive-tab active" data-tab="all">All</button>
              <button class="archive-tab" data-tab="Animal Management">Animals</button>
              <button class="archive-tab" data-tab="Adoption Management">Adoptions</button>
              <button class="archive-tab" data-tab="Post Adoption">Post Adoption</button>
              <button class="archive-tab" data-tab="Inventory">Inventory</button>
              <button class="archive-tab" data-tab="User Management">Users</button>
            </div>

            <div class="d-flex gap-2 flex-wrap align-items-center justify-content-between w-100">
              <div class="d-flex gap-2 flex-wrap">
                <div class="search-pill-sm">
                  <i class="bi bi-search"></i>
                  <input
                    type="text"
                    id="searchArchive"
                    placeholder="Search ID, title, module, archived by..."
                    autocomplete="off"
                  />
                </div>

                <select class="filter-select" id="filterType">
                  <option value="">All types</option>
                  <option value="Animal Record">Animal Record</option>
                  <option value="Adoption Record">Adoption Record</option>
                  <option value="Post-Adoption Case">Post-Adoption Case</option>
                  <option value="Inventory Item">Inventory Item</option>
                  <option value="User Account">User Account</option>
                </select>

                <select class="filter-select" id="filterReason">
                  <option value="">All reasons</option>
                  <option value="Duplicate">Duplicate</option>
                  <option value="Completed">Completed</option>
                  <option value="Inactive">Inactive</option>
                  <option value="Transferred">Transferred</option>
                  <option value="Replaced">Replaced</option>
                </select>
              </div>
            </div>
          </div>

          <div class="table-responsive">
            <table class="shelter-table">
              <thead>
                <tr>
                  <th>Archived Record</th>
                  <th>Module</th>
                  <th>Type</th>
                  <th>Reason</th>
                  <th>Date Archived</th>
                  <th>Archived By</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="archiveTableBody">
                <tr>
                  <td colspan="7" class="text-center py-5">
                    <div class="um-spinner"></div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="um-pagination" id="paginationBar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="um-modal-backdrop" id="viewArchiveModalBackdrop">
    <div class="um-modal archive-modal" role="dialog" aria-modal="true">
      <div class="um-modal-header">
        <div>
          <h2>Archived Record Details</h2>
          <p class="modal-subtitle">Review the archived item information</p>
        </div>
        <button class="modal-close-btn" id="viewArchiveClose">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="um-modal-body">
        <div id="viewArchiveContent"></div>
      </div>

      <div class="um-modal-footer">
        <button class="btn-outline-add" id="viewArchiveCloseFooter">Close</button>
        <button class="btn-primary-clay" id="modalRestoreBtn">
          <i class="bi bi-arrow-clockwise"></i> Restore Record
        </button>
      </div>
    </div>
  </div>

  <div class="um-toast" id="umToast">
    <i class="bi" id="toastIcon"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/management/archivedRecords.js"></script>
</body>
</html>
