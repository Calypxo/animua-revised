<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMUA — Animal Profiling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/adminDashboard.css" />
  <link rel="stylesheet" href="/src/css/sidebar.css" />
  <link rel="stylesheet" href="/src/css/animalProfiling.css" />
</head>
<body class="loading">
<div class="shell">
  <div id="sidebar-container"></div>
  <div class="stage">

    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="icon-btn"><i class="bi bi-list"></i></button>
        <nav class="d-flex align-items-center">
          <span class="breadcrumb-link">Animal Management</span>
          <i class="bi bi-chevron-right breadcrumb-sep"></i>
          <span class="breadcrumb-current">Animal Profiling</span>
        </nav>
      </div>
      <div class="topbar-right">
        <button class="icon-btn notif-btn"><i class="bi bi-bell-fill"></i><span class="notif-dot"></span></button>
        <div class="user-chip">
          <div class="user-avatar" id="topbar-initials">AS</div>
          <div class="user-meta"><span id="display-name">Admin</span><small id="display-role">Administrator</small></div>
          <i class="bi bi-chevron-down caret"></i>
        </div>
      </div>
    </header>

    <div class="page-body">

      <div class="page-header mb-4">
        <div>
          <h1 class="page-title">Animal Profiling</h1>
          <p class="page-sub">View and manage animal profiles across all lifecycle stages.</p>
        </div>
      </div>

      <!-- Stats -->
      <div class="ap-stats mb-4">
        <div class="ap-stat-card"><div class="ap-stat-icon icon-clay"><i class="bi bi-heart-pulse-fill"></i></div><div><div class="ap-stat-val" id="statTotal">0</div><div class="ap-stat-lbl">Total Animals</div></div></div>
        <div class="ap-stat-card"><div class="ap-stat-icon icon-amber"><i class="bi bi-clipboard2-fill"></i></div><div><div class="ap-stat-val" id="statProfiling">0</div><div class="ap-stat-lbl">In Profiling</div></div></div>
        <div class="ap-stat-card"><div class="ap-stat-icon icon-blue"><i class="bi bi-shield-plus"></i></div><div><div class="ap-stat-val" id="statQuarantine">0</div><div class="ap-stat-lbl">Quarantine</div></div></div>
        <div class="ap-stat-card"><div class="ap-stat-icon icon-green"><i class="bi bi-house-heart-fill"></i></div><div><div class="ap-stat-val" id="statReady">0</div><div class="ap-stat-lbl">Ready for Adoption</div></div></div>
        <div class="ap-stat-card"><div class="ap-stat-icon icon-rose"><i class="bi bi-balloon-heart-fill"></i></div><div><div class="ap-stat-val" id="statAdopted">0</div><div class="ap-stat-lbl">Adopted</div></div></div>
        <div class="ap-stat-card"><div class="ap-stat-icon icon-stone"><i class="bi bi-archive-fill"></i></div><div><div class="ap-stat-val" id="statArchived">0</div><div class="ap-stat-lbl">Archived</div></div></div>
      </div>

      <!-- Table panel -->
      <div class="panel">
        <div class="panel-head">
          <div class="ap-tabs">
            <button class="ap-tab active" data-tab="all">All</button>
            <button class="ap-tab" data-tab="Profiling">Profiling</button>
            <button class="ap-tab" data-tab="Quarantine">Quarantine</button>
            <button class="ap-tab" data-tab="Ready">Ready</button>
            <button class="ap-tab" data-tab="Adopted">Adopted</button>
            <button class="ap-tab" data-tab="Archived">Archived</button>
          </div>
          <div class="d-flex gap-2 flex-wrap align-items-center">
            <div class="search-pill-sm">
              <i class="bi bi-search"></i>
              <input type="text" id="searchAnimals" placeholder="Search name, ID, breed…" autocomplete="off" />
            </div>
            <select class="filter-select" id="filterSpecies">
              <option value="">All species</option>
              <option>Dog</option><option>Cat</option>
              <option>Rabbit</option><option>Bird</option><option>Other</option>
            </select>
            <select class="filter-select" id="filterSex">
              <option value="">Any sex</option>
              <option>Male</option><option>Female</option><option>Unknown</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="shelter-table">
            <thead>
              <tr>
                <th>Animal</th>
                <th>Species / Breed</th>
                <th>Sex / Age</th>
                <th>Source</th>
                <th>Days in Shelter</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="animalTableBody">
              <tr><td colspan="7" class="text-center py-5"><div class="um-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="um-pagination" id="paginationBar"></div>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div class="um-toast" id="umToast"><i class="bi" id="toastIcon"></i><span id="toastMsg"></span></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/management/animalProfiling.js"></script>
</body>
</html>
