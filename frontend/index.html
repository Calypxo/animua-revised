<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ANIMUA - Access Portal</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/public/auth.css">
  </head>

  <body class="auth-body">

<div id="splash-screen">
  <div class="splash-content">
    <img src="/src/assets/images/logo.png" alt="ANIMUA Logo" class="splash-logo">
  </div>
</div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
      <div class="auth-wrapper shadow-lg d-flex flex-column flex-lg-row w-100">

        <div class="auth-left position-relative d-flex flex-column p-5 text-white overflow-hidden">
          <img src="/src/assets/images/user-login.jpg" alt="Animu[/a Rescue" class="auth-left-bg-img">
          <div class="auth-left-overlay"></div>

          <div class="position-relative z-index-2 d-flex flex-column h-100 justify-content-center">
            <h5 class="fw-bold mb-4" style="letter-spacing: 2px;">ANIMUA</h5>
            <h1 class="display-5 fw-bold mb-3">Hello,<br>Welcome back to Animua!</h1>
          </div>
        </div>

        <div class="auth-right bg-white p-5 d-flex flex-column justify-content-center">

          <div id="login-section">
            <h2 class="text-center mb-5 fw-bold animua-form-title">Login</h2>

            <form id="login-form">
              <div class="input-group mb-4">
                <input type="email" id="login-email" class="form-control form-control-lg animua-input border-end-0" placeholder="Email" required>
                <span class="input-group-text bg-transparent border-start-0 text-muted">
                  <i class="bi bi-envelope"></i>
                </span>
              </div>

              <div class="input-group mb-2">
               <input type="password" id="login-password" class="form-control form-control-lg animua-input border-end-0" placeholder="Password" required>
                <span class="input-group-text bg-transparent border-start-0 text-muted">
              <i class="bi bi-eye-slash"></i>
               </span>
              </div>

            <div class="text-end mb-4">
                <a href="#" class="text-muted small text-decoration-none">Forgot password?</a>
            </div>

              <button type="submit" class="btn btn-lg w-100 shadow-sm mb-4 btn-animua-main">Login</button>
            </form>

            <div class="text-center mb-4 text-muted small">
              Don't have an account?
              <span class="animua-link fw-bold" role="button" onclick="toggleView()">Register here</span>
            </div>
          </div>

          <div id="register-section" class="hidden">
            <h2 class="text-center mb-5 fw-bold animua-form-title">Create Account</h2>

            <form id="register-form">
              <div class="input-group mb-3">
                <input type="text" id="reg-name" class="form-control form-control-lg animua-input border-end-0" placeholder="Full Name" required>
                <span class="input-group-text bg-transparent border-start-0 text-muted">
                  <i class="bi bi-person"></i>
                </span>
              </div>

              <div class="input-group mb-3">
                <input type="email" id="reg-email" class="form-control form-control-lg animua-input border-end-0" placeholder="Email Address" required>
                <span class="input-group-text bg-transparent border-start-0 text-muted">
                  <i class="bi bi-envelope"></i>
                </span>
              </div>

              <div class="input-group mb-4">
                 <input type="password" id="reg-password" class="form-control form-control-lg animua-input border-end-0" placeholder="Create Password" required>
                 <span class="input-group-text bg-transparent border-start-0 text-muted">
                 <i class="bi bi-eye-slash"></i>
                </span>
              </div>

              <button type="submit" class="btn btn-lg w-100 shadow-sm mb-4 btn-animua-main">Sign Up</button>
            </form>

            <div class="text-center mb-4 text-muted small">
              Already a member?
              <span class="animua-link fw-bold" role="button" onclick="toggleView()">Login here</span>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
