<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ANIMUA - Admin Access</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

<link rel="stylesheet" href="/src/css/global.css">
<link rel="stylesheet" href="/src/css/management/admin-login.css">

</head>


<body class="admin-login-body">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

<div class="login-box shadow-lg">

<div class="row g-0 h-100 w-100">


<!-- LEFT VISUAL PANEL -->
<div class="col-md-6 login-visual-panel">

<div class="visual-content">

<span class="fs-5 mb-4 d-block fw-bold">
ANIMUA
</span>

<h1>
Hello,<br>
Welcome back to Animua!
</h1>

<p class="mt-3">
Authorized staff access only.
</p>

</div>

</div>


<!-- RIGHT LOGIN FORM -->
<div class="col-md-6 login-form-panel">

<div class="form-wrapper">

<h2 class="text-center">
Admin Login
</h2>


<form id="login-form">

<div class="form-floating mb-3 position-relative">

<input
type="email"
class="form-control"
id="login-email"
placeholder=" "
autocomplete="email"
required
>

<label for="login-email">Email</label>

<i class="bi bi-envelope position-absolute end-0 top-50 translate-middle-y me-3 text-muted"></i>

</div>



<div class="form-floating mb-3 position-relative">

<input
type="password"
class="form-control"
id="login-password"
placeholder=" "
autocomplete="current-password"
required
>

<label for="login-password">Password</label>

<i
class="bi bi-eye-slash position-absolute end-0 top-50 translate-middle-y me-3 text-muted cursor-pointer"
id="togglePassword"
></i>

</div>



<div class="text-end mb-4">

<a href="#" class="text-muted small">
Forgot password?
</a>

</div>



<button type="submit" class="btn btn-login w-100 shadow-sm">
Login
</button>

</form>



<div class="text-center mt-4">

<a href="/" class="admin-back-link">
Back to Public Portal
</a>

</div>


</div>
</div>


</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/src/main.js"></script>


<script>

document.addEventListener("DOMContentLoaded", () => {

const toggleBtn = document.querySelector("#togglePassword");
const passField = document.querySelector("#login-password");

if(toggleBtn && passField){

toggleBtn.addEventListener("click", () => {

const isPassword = passField.type === "password";

passField.type = isPassword ? "text" : "password";

toggleBtn.classList.toggle("bi-eye");
toggleBtn.classList.toggle("bi-eye-slash");

});

}

});

</script>



</body>
</html>
