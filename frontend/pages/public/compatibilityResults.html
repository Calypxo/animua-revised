<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMUA | Compatibility Results</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --wine: #6F191C;
      --steel: #5786BC;
      --amber: #FECD6E;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    body {
      margin: 0;
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      color: var(--text-dark);
    }

    .results-shell {
      min-height: 100vh;
      padding: 40px 16px;
    }

    .results-wrapper {
      max-width: 1100px;
      margin: 0 auto;
    }

    .results-hero {
      background: linear-gradient(135deg, rgba(111,25,28,0.95), rgba(87,134,188,0.95));
      color: white;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    .results-hero h1 {
      font-family: "Outfit", sans-serif;
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .results-hero p {
      margin: 0;
      font-size: 15px;
      line-height: 1.7;
      max-width: 720px;
      opacity: 0.95;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    }

    .result-card-body {
      padding: 22px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 18px;
    }

    .result-name {
      font-family: "Outfit", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .result-breed {
      color: var(--text-muted);
      margin: 0;
      font-size: 14px;
    }

    .match-badge {
      background: rgba(87,134,188,0.12);
      color: var(--steel);
      border: 1px solid rgba(87,134,188,0.2);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .result-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .info-box {
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .info-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-value {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-dark);
    }

    .result-summary {
      background: #fcfcfd;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 18px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-soft {
      border: 1px solid var(--border);
      background: white;
      color: var(--text-dark);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      text-decoration: none;
    }

    .btn-soft:hover {
      background: #f9fafb;
    }

    .btn-primary-match {
      border: none;
      background: var(--wine);
      color: white;
      border-radius: 12px;
      padding: 10px 18px;
      font-weight: 700;
    }

    .btn-primary-match:hover {
      background: #571316;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .results-hero,
      .result-card-body {
        padding: 20px;
      }

      .result-top {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="results-shell">
    <div class="results-wrapper">
      <a href="/pages/public/petCompatibility.html" class="back-link">
        <i class="bi bi-arrow-left"></i> Back to Quiz
      </a>

      <section class="results-hero">
        <h1>Your Best Matches</h1>
        <p>
          Based on the quiz answers, these are the animals that best match the adopter’s
          lifestyle, preferences, and home setup.
        </p>
      </section>

      <section>
        <div id="results-container" class="results-grid"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/src/public/js/compatibilityResults.js"></script>
</body>
</html>
