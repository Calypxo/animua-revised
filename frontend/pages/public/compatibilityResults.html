<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMUA — Your Best Matches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --clay:      #6f191c;
      --clay-2:    #9b2d30;
      --clay-soft: #fdf0f0;
      --amber:     #f0a500;
      --amber-soft:#fff8e6;
      --teal:      #0d7377;
      --teal-soft: #e6f7f7;
      --green:     #1a7a40;
      --green-soft:#e8f7ee;
      --blue:      #2558a8;
      --blue-soft: #e8f0fb;
      --ink:       #0f0d0d;
      --ink-2:     #2a2525;
      --stone:     #7a7070;
      --stone-2:   #b0a8a8;
      --cream:     #fdfaf7;
      --cream-2:   #f5f0ea;
      --white:     #ffffff;
      --serif:     'Fraunces', Georgia, serif;
      --sans:      'Plus Jakarta Sans', sans-serif;
      --ease:      cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── BG ─────────────────────────────────────────── */
    .bg-canvas { position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden; }
    .bg-blob   { position:absolute;border-radius:50%;filter:blur(90px);opacity:0.22; }
    .blob-1 { width:600px;height:600px;background:radial-gradient(circle,#f9d0d0,transparent);top:-100px;right:-100px; }
    .blob-2 { width:500px;height:500px;background:radial-gradient(circle,#d0f0ee,transparent);bottom:-80px;left:-80px; }

    /* ── Nav ─────────────────────────────────────────── */
    .topnav {
      position:sticky;top:0;z-index:100;
      background:rgba(253,250,247,0.92);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(0,0,0,0.07);
      padding:16px 40px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    }
    .nav-brand {
      display:flex;align-items:center;gap:8px;font-family:var(--serif);
      font-size:1rem;font-weight:700;color:var(--ink);text-decoration:none;
    }
    .nav-brand-dot { width:28px;height:28px;background:var(--clay);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.8rem; }
    .nav-back {
      display:flex;align-items:center;gap:6px;font-size:0.84rem;font-weight:600;
      color:var(--stone);text-decoration:none;padding:7px 14px;border-radius:999px;
      border:1px solid rgba(0,0,0,0.1);transition:all 230ms var(--ease);
    }
    .nav-back:hover { color:var(--clay);border-color:rgba(111,25,28,0.2);background:var(--clay-soft); }
    .nav-retake {
      margin-left:auto;display:flex;align-items:center;gap:6px;font-size:0.84rem;
      font-weight:600;color:var(--clay);text-decoration:none;padding:7px 16px;
      border-radius:999px;border:1.5px solid rgba(111,25,28,0.2);
      background:var(--clay-soft);transition:all 230ms var(--ease);
    }
    .nav-retake:hover { background:var(--clay);color:#fff; }

    /* ── Shell ───────────────────────────────────────── */
    .results-shell { position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px 24px 80px; }

    /* ── Hero ────────────────────────────────────────── */
    .results-hero {
      background:linear-gradient(135deg,var(--clay) 0%,#a83235 100%);
      border-radius:24px;padding:36px 40px;margin-bottom:40px;
      display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
      position:relative;overflow:hidden;
      animation:fadeUp 0.5s var(--ease) both;
    }
    .results-hero::before {
      content:''; position:absolute;inset:0;
      background:url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Ccircle cx='20' cy='20' r='3'/%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-text { position:relative;z-index:1; }
    .hero-eyebrow { font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.6);margin-bottom:8px; }
    .hero-title { font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;color:#fff;margin-bottom:8px; }
    .hero-title em { font-style:italic;opacity:0.85; }
    .hero-sub { font-size:0.9rem;color:rgba(255,255,255,0.75);line-height:1.6;max-width:500px; }

    .hero-badges { display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1; }
    .hero-badge  {
      background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
      border-radius:12px;padding:12px 18px;text-align:center;backdrop-filter:blur(4px);
    }
    .hb-num { font-family:var(--serif);font-size:1.6rem;font-weight:900;color:#fff;line-height:1; }
    .hb-lbl { font-size:0.7rem;font-weight:600;color:rgba(255,255,255,0.6);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px; }

    /* ── Filter bar ──────────────────────────────────── */
    .filter-bar {
      display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap;
      animation:fadeUp 0.5s var(--ease) 0.1s both;
    }
    .filter-bar span { font-size:0.82rem;font-weight:600;color:var(--stone); }
    .filter-chip {
      padding:6px 14px;border-radius:999px;border:1.5px solid rgba(0,0,0,0.1);
      background:var(--white);font-size:0.8rem;font-weight:600;color:var(--stone);
      cursor:pointer;transition:all 200ms;
    }
    .filter-chip:hover   { border-color:var(--clay);color:var(--clay);background:var(--clay-soft); }
    .filter-chip.active  { background:var(--clay);color:#fff;border-color:var(--clay); }

    /* ── Results grid ────────────────────────────────── */
    .results-grid { display:flex;flex-direction:column;gap:20px; }

    /* ── Result card ─────────────────────────────────── */
    .result-card {
      background:var(--white);border:1px solid rgba(0,0,0,0.08);
      border-radius:22px;overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,0.05);
      transition:transform 300ms var(--ease),box-shadow 300ms var(--ease);
      animation:fadeUp 0.5s var(--ease) both;
    }
    .result-card:hover { transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,0.1); }
    .result-card.rank-1 { border-color:rgba(111,25,28,0.25);box-shadow:0 4px 24px rgba(111,25,28,0.1); }

    .result-card-inner { display:flex;align-items:stretch; }

    /* Rank stripe */
    .rank-stripe {
      width:8px;flex-shrink:0;
      background:var(--cream-2);
    }
    .rank-stripe.s-1 { background:linear-gradient(180deg,var(--clay),#e05a5d); }
    .rank-stripe.s-2 { background:linear-gradient(180deg,#c87533,var(--amber)); }
    .rank-stripe.s-3 { background:linear-gradient(180deg,var(--teal),#0a9da1); }

    .result-body { flex:1;padding:24px 26px 22px;min-width:0; }

    /* Card top row */
    .card-top {
      display:flex;align-items:flex-start;justify-content:space-between;
      gap:16px;margin-bottom:16px;flex-wrap:wrap;
    }
    .card-rank { display:flex;align-items:center;gap:10px; }
    .rank-num {
      font-family:var(--serif);font-size:0.75rem;font-weight:700;
      color:var(--stone-2);text-transform:uppercase;letter-spacing:0.1em;
    }
    .rank-emoji { font-size:1.2rem; }
    .pet-name { font-family:var(--serif);font-size:1.5rem;font-weight:900;color:var(--ink);line-height:1;margin-bottom:4px; }
    .pet-sub  { font-size:0.85rem;color:var(--stone);display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
    .pet-sub-dot { width:4px;height:4px;border-radius:50%;background:var(--stone-2); }

    /* Match score ring */
    .match-ring-wrap {
      display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;
    }
    .match-ring {
      position:relative;width:72px;height:72px;
    }
    .match-ring svg { width:72px;height:72px;transform:rotate(-90deg); }
    .ring-track { fill:none;stroke:rgba(0,0,0,0.07);stroke-width:5; }
    .ring-fill  { fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 0.8s var(--ease); }
    .ring-label {
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
    }
    .ring-pct  { font-family:var(--serif);font-size:1rem;font-weight:900;color:var(--ink);line-height:1; }
    .ring-sub  { font-size:0.55rem;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:0.05em; }
    .match-strength { font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em; }

    /* Info chips row */
    .info-chips {
      display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
    }
    .info-chip {
      display:inline-flex;align-items:center;gap:5px;
      padding:4px 11px;border-radius:7px;
      font-size:0.75rem;font-weight:700;
    }
    .chip-species { background:var(--amber-soft);color:#92400e; }
    .chip-sex     { background:var(--blue-soft);color:var(--blue); }
    .chip-size    { background:var(--teal-soft);color:var(--teal); }
    .chip-special { background:var(--clay-soft);color:var(--clay); }

    /* Trait bars */
    .traits-section { margin-bottom:16px; }
    .traits-title   { font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--stone);margin-bottom:10px; }
    .trait-bars     { display:flex;flex-direction:column;gap:6px; }
    .trait-row      { display:grid;grid-template-columns:110px 1fr 36px;align-items:center;gap:10px; }
    .trait-name     { font-size:0.76rem;font-weight:600;color:var(--stone); }
    .trait-track    { height:5px;background:rgba(0,0,0,0.07);border-radius:999px;overflow:hidden; }
    .trait-fill     { height:100%;border-radius:999px;transition:width 0.6s var(--ease); }
    .trait-match    { font-size:0.7rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif; }
    .t-great  { color:var(--green); }
    .t-good   { color:var(--teal); }
    .t-ok     { color:var(--amber); }
    .t-diff   { color:var(--clay); }

    /* Summary */
    .pet-summary {
      background:var(--cream);border-radius:12px;padding:12px 16px;
      font-size:0.855rem;color:var(--stone);line-height:1.65;margin-bottom:16px;
      border-left:3px solid rgba(111,25,28,0.2);
    }
    .pet-summary strong { color:var(--ink); }

    /* Actions */
    .card-actions { display:flex;gap:10px;flex-wrap:wrap; }
    .btn-profile {
      display:inline-flex;align-items:center;gap:7px;
      padding:10px 18px;border:1.5px solid rgba(0,0,0,0.1);
      border-radius:11px;background:var(--white);color:var(--ink-2);
      font:600 0.875rem var(--sans);cursor:pointer;text-decoration:none;
      transition:all 230ms var(--ease);
    }
    .btn-profile:hover { border-color:var(--clay);color:var(--clay);background:var(--clay-soft); }
    .btn-adopt {
      display:inline-flex;align-items:center;gap:7px;
      padding:11px 22px;background:var(--clay);color:#fff;
      border:none;border-radius:11px;font:700 0.875rem var(--sans);
      cursor:pointer;text-decoration:none;
      box-shadow:0 3px 12px rgba(111,25,28,0.3);
      transition:all 230ms var(--ease);
    }
    .btn-adopt:hover { background:var(--clay-2);transform:translateY(-1px);box-shadow:0 6px 18px rgba(111,25,28,0.35); }

    /* ── No results ──────────────────────────────────── */
    .no-results {
      background:var(--white);border-radius:22px;border:1px dashed rgba(0,0,0,0.15);
      padding:60px 32px;text-align:center;
    }
    .no-results-icon { font-size:3rem;margin-bottom:16px; }
    .no-results h2   { font-family:var(--serif);font-size:1.6rem;font-weight:900;margin-bottom:10px; }
    .no-results p    { color:var(--stone);font-size:0.9rem;line-height:1.6;max-width:400px;margin:0 auto 24px; }

    /* ── Loading ─────────────────────────────────────── */
    .loading-state { text-align:center;padding:80px 24px; }
    .loading-icon  { font-size:2.5rem;margin-bottom:16px;animation:spin 2s linear infinite;display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    @keyframes fadeUp {
      from { opacity:0;transform:translateY(16px); }
      to   { opacity:1;transform:translateY(0); }
    }

    @media(max-width:700px) {
      .result-card-inner { flex-direction:column; }
      .rank-stripe        { width:100%;height:5px; }
      .topnav             { padding:14px 16px; }
      .results-hero       { padding:24px 20px; }
      .trait-row          { grid-template-columns:90px 1fr 28px; }
    }
  </style>
</head>
<body>

<div class="bg-canvas">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
</div>

<nav class="topnav">
  <a href="/pages/public/home.html" class="nav-brand">
    <div class="nav-brand-dot">🐾</div>
    <span>ANIMUA</span>
  </a>
  <a href="/pages/public/petCompatibility.html" class="nav-back">
    <i class="bi bi-arrow-left"></i> Back to Quiz
  </a>
  <a href="/pages/public/petCompatibility.html" class="nav-retake">
    <i class="bi bi-arrow-clockwise"></i> Retake Quiz
  </a>
</nav>

<main class="results-shell" id="resultsShell">
  <div class="loading-state">
    <div class="loading-icon">🐾</div>
    <p style="color:var(--stone);font-size:0.9rem">Loading your matches…</p>
  </div>
</main>

<script>
/* ══════════════════════════════════════════════════════
   KEY TRAITS TO DISPLAY IN CARDS
══════════════════════════════════════════════════════ */
const DISPLAY_TRAITS = [
  { key:"energyLevel",          label:"Energy Level"      },
  { key:"friendlinessToHumans", label:"Friendliness"      },
  { key:"affectionLevel",       label:"Affection"         },
  { key:"goodWithKids",         label:"Good With Kids"    },
  { key:"goodWithOtherPets",    label:"Good With Pets"    },
  { key:"trainingDifficulty",   label:"Trainability"      },
];

const TRAIT_COLORS = [
  "#1a7a40","#0d7377","#2558a8","#f0a500","#9b2d30","#6f191c"
];

const RANK_EMOJI   = ["🥇","🥈","🥉","4️⃣","5️⃣"];
const RANK_LABELS  = ["Best Match","2nd Match","3rd Match","4th Match","5th Match"];
const STRIPE_CLS   = ["s-1","s-2","s-3","",""];

/* ── Match score ring helpers ─────────────────────── */
function ringColor(pct) {
  if (pct >= 80) return "#1a7a40";
  if (pct >= 65) return "#0d7377";
  if (pct >= 50) return "#f0a500";
  return "#9b2d30";
}

function matchStrength(pct) {
  if (pct >= 80) return { label:"Excellent Match", cls:"t-great" };
  if (pct >= 65) return { label:"Great Match",     cls:"t-good"  };
  if (pct >= 50) return { label:"Good Match",      cls:"t-ok"    };
  return                 { label:"Partial Match",   cls:"t-diff"  };
}

/* ── Trait diff indicator ─────────────────────────── */
function traitMatch(petVal, userPrefs, key) {
  const userVal = userPrefs?.[key];
  if (!userVal) return { cls:"t-ok", symbol:"–" };
  const diff = Math.abs(petVal - userVal);
  if (diff === 0) return { cls:"t-great", symbol:"✓✓" };
  if (diff <= 1)  return { cls:"t-good",  symbol:"✓"  };
  if (diff <= 2)  return { cls:"t-ok",    symbol:"~"  };
  return                 { cls:"t-diff",  symbol:"≠"  };
}

/* ── Build match summary prose ─────────────────────── */
function buildSummary(pet) {
  const traits = [];
  if (pet.affectionLevel    >= 4) traits.push("affectionate");
  if (pet.playfulness       >= 4) traits.push("playful");
  if (pet.friendlinessToHumans >= 4) traits.push("great with people");
  if (pet.goodWithKids      >= 4) traits.push("wonderful around children");
  if (pet.goodWithOtherPets >= 4) traits.push("comfortable with other pets");
  if (pet.groomingNeeds     <= 2) traits.push("low-maintenance to groom");
  if (pet.noiseLevel        <= 2) traits.push("a quiet companion");
  if (pet.adaptability      >= 4) traits.push("adaptable to new routines");

  const name    = `<strong>${pet.name}</strong>`;
  const pct     = pet.matchPercent;
  const species = pet.species?.toLowerCase() || "pet";

  if (!traits.length) {
    return `${name} is a strong compatibility match with a ${pct}% score. This ${species}'s behavioral profile aligns well with your lifestyle and care preferences.`;
  }

  const traitStr = traits.length > 1
    ? traits.slice(0,-1).join(", ") + ` and ${traits[traits.length-1]}`
    : traits[0];

  return `${name} is a ${pct}% match — this ${species} is ${traitStr}. The overall behavioral profile closely aligns with your daily routine and home environment.`;
}

/* ── Render single card ─────────────────────────────── */
function buildCard(pet, rank, userPrefs) {
  const pct         = Math.round(pet.matchPercent) || 0;
  const circumference= 2 * Math.PI * 26;
  const offset      = circumference - (pct / 100) * circumference;
  const color       = ringColor(pct);
  const { label: mLabel, cls: mCls } = matchStrength(pct);
  const delay       = rank * 80;

  const traitBarsHtml = DISPLAY_TRAITS.map((t, i) => {
    const val  = pet[t.key] || 0;
    const pctW = val * 20;
    const tm   = traitMatch(val, userPrefs, t.key);
    return `
      <div class="trait-row">
        <span class="trait-name">${t.label}</span>
        <div class="trait-track">
          <div class="trait-fill" style="width:${pctW}%;background:${TRAIT_COLORS[i]}"></div>
        </div>
        <span class="trait-match ${tm.cls}">${tm.symbol}</span>
      </div>`;
  }).join("");

  return `
    <article class="result-card ${rank===0?"rank-1":""}" style="animation-delay:${delay}ms">
      <div class="result-card-inner">
        <div class="rank-stripe ${STRIPE_CLS[rank]||""}"></div>
        <div class="result-body">
          <div class="card-top">
            <div>
              <div class="card-rank">
                <span class="rank-num">${RANK_LABELS[rank]}</span>
                <span class="rank-emoji">${RANK_EMOJI[rank]||""}</span>
              </div>
              <div class="pet-name">${pet.name || "Unknown"}</div>
              <div class="pet-sub">
                <span>${pet.species || "—"}</span>
                <div class="pet-sub-dot"></div>
                <span>${pet.breed || "Mixed Breed"}</span>
                ${pet.sex ? `<div class="pet-sub-dot"></div><span>${pet.sex}</span>` : ""}
                ${pet.size ? `<div class="pet-sub-dot"></div><span>${pet.size}</span>` : ""}
              </div>
            </div>
            <div class="match-ring-wrap">
              <div class="match-ring">
                <svg viewBox="0 0 60 60">
                  <circle class="ring-track" cx="30" cy="30" r="26"/>
                  <circle class="ring-fill"
                    cx="30" cy="30" r="26"
                    stroke="${color}"
                    stroke-dasharray="${circumference}"
                    stroke-dashoffset="${offset}"/>
                </svg>
                <div class="ring-label">
                  <span class="ring-pct">${pct}%</span>
                  <span class="ring-sub">match</span>
                </div>
              </div>
              <span class="match-strength ${mCls}">${mLabel}</span>
            </div>
          </div>

          <div class="info-chips">
            ${pet.species ? `<span class="info-chip chip-species">🐾 ${pet.species}</span>` : ""}
            ${pet.sex     ? `<span class="info-chip chip-sex">${pet.sex==="Male"?"♂":"♀"} ${pet.sex}</span>` : ""}
            ${pet.size    ? `<span class="info-chip chip-size">📐 ${pet.size}</span>` : ""}
            ${pet.allergyFriendly  === true  ? `<span class="info-chip chip-special">✓ Allergy-Friendly</span>` : ""}
            ${pet.specialNeeds     === true  ? `<span class="info-chip chip-special" style="background:var(--amber-soft);color:#7a4000">⭐ Special Needs</span>` : ""}
          </div>

          <div class="traits-section">
            <div class="traits-title">Trait comparison <span style="font-weight:400;text-transform:none;font-style:italic">(your answers vs. this pet)</span></div>
            <div class="trait-bars">${traitBarsHtml}</div>
            <div style="display:flex;gap:14px;margin-top:8px;font-size:0.72rem;color:var(--stone)">
              <span><span style="color:var(--green);font-weight:700">✓✓</span> Perfect</span>
              <span><span style="color:var(--teal);font-weight:700">✓</span> Close</span>
              <span><span style="color:var(--amber);font-weight:700">~</span> Near</span>
              <span><span style="color:var(--clay);font-weight:700">≠</span> Different</span>
            </div>
          </div>

          <div class="pet-summary">${buildSummary(pet)}</div>

          <div class="card-actions">
            <a href="/pages/public/find-furbabies.html"
               class="btn-profile"
               onclick="localStorage.setItem('animua_selected_pet_id','${pet.id||pet.petId||""}')">
              <i class="bi bi-eye"></i> View Profile
            </a>
            <a href="/pages/public/find-furbabies.html"
               class="btn-adopt"
               onclick="localStorage.setItem('animua_selected_pet_id','${pet.id||pet.petId||""}')">
              <i class="bi bi-heart-fill"></i> Apply to Adopt
            </a>
          </div>
        </div>
      </div>
    </article>`;
}

/* ── Main render ─────────────────────────────────────── */
function render() {
  const results  = JSON.parse(localStorage.getItem("animua_match_results") || "[]");
  const quizData = JSON.parse(localStorage.getItem("animua_quiz_data")     || "{}");
  const prefs    = quizData.preferences || {};
  const shell    = document.getElementById("resultsShell");

  if (!results.length) {
    shell.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <h2>No matches found</h2>
        <p>We couldn't find any compatible pets based on your answers. Try adjusting your filters or retaking the quiz with different preferences.</p>
        <a href="/pages/public/petCompatibility.html" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--clay);color:#fff;border-radius:12px;font:700 0.9rem var(--sans);text-decoration:none">
          <i class="bi bi-arrow-clockwise"></i> Retake Quiz
        </a>
      </div>`;
    return;
  }

  const top5 = results.slice(0, 5);

  shell.innerHTML = `
    <section class="results-hero">
      <div class="hero-text">
        <div class="hero-eyebrow">Compatibility Results</div>
        <h1 class="hero-title">Your <em>best matches</em> are here!</h1>
        <p class="hero-sub">Based on your quiz answers, these are the animals that best match your lifestyle, home environment, and care capacity. Ranked by compatibility score.</p>
      </div>
      <div class="hero-badges">
        <div class="hero-badge">
          <div class="hb-num">${top5.length}</div>
          <div class="hb-lbl">Matches Found</div>
        </div>
        <div class="hero-badge">
          <div class="hb-num">${Math.round(top5[0]?.matchPercent||0)}%</div>
          <div class="hb-lbl">Top Score</div>
        </div>
        <div class="hero-badge">
          <div class="hb-num">${quizData.filters?.preferredSpecies||"Any"}</div>
          <div class="hb-lbl">Species Filter</div>
        </div>
      </div>
    </section>

    <div class="results-grid" id="resultsGrid">
      ${top5.map((pet, i) => buildCard(pet, i, prefs)).join("")}
    </div>

    <div style="text-align:center;margin-top:40px;padding-top:32px;border-top:1px solid rgba(0,0,0,0.08)">
      <p style="color:var(--stone);font-size:0.875rem;margin-bottom:16px">
        These results are suggestions based on your answers. Final adoption approval depends on shelter review and pet availability.
      </p>
      <a href="/pages/public/petCompatibility.html"
         style="display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border:1.5px solid rgba(111,25,28,0.2);border-radius:999px;color:var(--clay);font:600 0.875rem 'Plus Jakarta Sans',sans-serif;text-decoration:none;background:var(--clay-soft);transition:all 200ms">
        <i class="bi bi-arrow-clockwise"></i> Retake Quiz with Different Answers
      </a>
    </div>`;
}

render();
</script>
</body>
</html>
