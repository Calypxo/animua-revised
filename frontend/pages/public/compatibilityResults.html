<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIMUA — Your Best Matches</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../src/css/public/compatibilityResults.css" />
<link rel="stylesheet" href="../../src/css/public/public-design-system.css" />
  
</head>
<body>

<div class="bg-canvas">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
</div>

<nav class="topnav">
  <a href="/pages/public/home.html" class="nav-brand">
    <img src="../../src/assets/images/animua-logo-transparent.png" alt="ANIMUA" class="public-brand-logo">
    <span>ANIMUA</span>
  </a>
  <a href="/pages/public/petCompatibility.html" class="nav-back">
    <i class="bi bi-arrow-left"></i> Back to Quiz
  </a>
  <a href="/pages/public/petCompatibility.html" class="nav-retake">
    <i class="bi bi-arrow-clockwise"></i> Retake Quiz
  </a>
</nav>

<main class="results-shell" id="resultsShell">
  <div class="loading-state">
    <div class="loading-icon"></div>
    <p style="color:var(--stone);font-size:0.9rem">Loading your matches…</p>
  </div>
</main>

<!-- ALL LOGIC INLINE — no external script needed -->
<script>
/* ══════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════ */
const DISPLAY_TRAITS = [
  { key:"energyLevel",          label:"Energy Level"     },
  { key:"friendlinessToHumans", label:"Friendliness"     },
  { key:"affectionLevel",       label:"Affection"        },
  { key:"goodWithKids",         label:"Good With Kids"   },
  { key:"goodWithOtherPets",    label:"Good With Pets"   },
  { key:"trainingDifficulty",   label:"Trainability"     },
];
const TRAIT_COLORS  = ["#1a7a40","#0d7377","#2558a8","#f0a500","#9b2d30","#6f191c"];
const RANK_EMOJI    = ["🥇","🥈","🥉","4️⃣","5️⃣"];
const RANK_LABELS   = ["Best Match","2nd Match","3rd Match","4th Match","5th Match"];
const STRIPE_CLASS  = ["s-1","s-2","s-3","",""];

/* ── Helpers ───────────────────────────────────────── */
function ringColor(pct) {
  if (pct >= 80) return "#1a7a40";
  if (pct >= 65) return "#0d7377";
  if (pct >= 50) return "#f0a500";
  return "#9b2d30";
}

function matchLabel(pct) {
  if (pct >= 80) return { text:"Excellent Match", cls:"t-great" };
  if (pct >= 65) return { text:"Great Match",     cls:"t-good"  };
  if (pct >= 50) return { text:"Good Match",      cls:"t-ok"    };
  return               { text:"Partial Match",    cls:"t-diff"  };
}

function animalLabel(pet = {}) {
  return (
    pet.displayLabel ||
    pet.shelterLabel ||
    pet.identifyingDescription ||
    pet.name ||
    `Animal ${pet.id || pet.petId || ""}`.trim()
  );
}

function traitSymbol(petVal, userVal) {
  if (!userVal) return { cls:"t-ok", sym:"–" };
  const d = Math.abs(petVal - userVal);
  if (d === 0) return { cls:"t-great", sym:"✓✓" };
  if (d <= 1)  return { cls:"t-good",  sym:"✓"  };
  if (d <= 2)  return { cls:"t-ok",    sym:"~"  };
  return             { cls:"t-diff",   sym:"≠"  };
}

function buildSummary(pet) {
  const traits = [];
  if (Number(pet.affectionLevel) >= 4) traits.push("affectionate");
  if (Number(pet.playfulness) >= 4) traits.push("playful");
  if (Number(pet.friendlinessToHumans) >= 4) traits.push("great with people");
  if (Number(pet.goodWithKids) >= 4) traits.push("wonderful around children");
  if (Number(pet.goodWithOtherPets) >= 4) traits.push("comfortable with other pets");
  if (Number(pet.groomingNeeds) > 0 && Number(pet.groomingNeeds) <= 2) traits.push("low-maintenance to groom");
  if (Number(pet.noiseLevel) > 0 && Number(pet.noiseLevel) <= 2) traits.push("a quiet companion");
  if (Number(pet.adaptability) >= 4) traits.push("adaptable to new routines");

  const name = `<strong>${animalLabel(pet)}</strong>`;
  const pct = Math.round(Number(pet.matchPercent || 0));
  const species = (pet.species || "pet").toLowerCase();

  if (!traits.length) {
    return `${name} is a strong compatibility match with a ${pct}% score. This ${species}'s behavioral profile closely aligns with your lifestyle and care preferences.`;
  }

  const traitStr = traits.length > 1
    ? traits.slice(0, -1).join(", ") + ` and ${traits[traits.length - 1]}`
    : traits[0];

  return `${name} is a ${pct}% match — this ${species} is ${traitStr}. The overall behavioral profile closely fits your daily routine and home environment.`;
}

/* ── Card builder ──────────────────────────────────── */
function buildCard(pet, rank, prefs) {
  const pct = Math.round(Number(pet.matchPercent || 0));
  const petImage = pet.photoURL || pet.photoUrl || "/images/default-pet.jpg";
  const displayLabel = animalLabel(pet);

  const bestMatchBadge = rank === 0
    ? `<div class="best-match-badge"><i class="bi bi-stars"></i> Recommended for You</div>`
    : "";

  const circ = 2 * Math.PI * 26;
  const offset = circ - (pct / 100) * circ;
  const color = ringColor(pct);
  const ml = matchLabel(pct);
  const petId = pet.id || pet.petId || "";
  const delay = rank * 80;

  const traitBars = DISPLAY_TRAITS.map((t, i) => {
    const val  = Number(pet[t.key] || 0);
    const pctW = val * 20;
    const uv   = prefs ? Number(prefs[t.key] || 0) : 0;
    const ts   = traitSymbol(val, uv);
    return `
      <div class="trait-row">
        <span class="trait-name">${t.label}</span>
        <div class="trait-track">
          <div class="trait-fill" style="width:${pctW}%;background:${TRAIT_COLORS[i]}"></div>
        </div>
        <span class="trait-match ${ts.cls}">${ts.sym}</span>
      </div>`;
  }).join("");

  const chips = [
    pet.species ? `<span class="info-chip chip-species">${pet.species}</span>` : "",
    pet.sex     ? `<span class="info-chip chip-sex">${pet.sex==="Male"?"♂":"♀"} ${pet.sex}</span>` : "",
    pet.size    ? `<span class="info-chip chip-size">📐 ${pet.size}</span>` : "",
    pet.allergyFriendly === true  ? `<span class="info-chip chip-allergy">✓ Allergy-Friendly</span>` : "",
    pet.specialNeeds    === true  ? `<span class="info-chip chip-special" style="background:var(--amber-soft);color:#7a4000">⭐ Special Needs</span>` : "",
  ].filter(Boolean).join("");

  return `
  <article class="result-card ${rank===0?"rank-1":""}" style="animation-delay:${delay}ms">
    
    <div class="result-card-inner">
      <div class="rank-stripe ${STRIPE_CLASS[rank]||""}"></div>
      <div class="result-body">

        <!-- Top row: name + score ring -->
        <div class="card-top">
          <div>
            <div class="card-rank">
              <span class="rank-num">${RANK_LABELS[rank]}</span>
              <span class="rank-emoji">${RANK_EMOJI[rank]||""}</span>
            </div>

            <div class="pet-media">
              <img src="${petImage}" alt="${displayLabel}" class="pet-image">
            </div>

            <div class="pet-name">${displayLabel}</div>
            <div style="color:var(--stone-2);font-size:0.76rem;margin-top:4px">Shelter description · Animal ID: ${petId}</div>
            ${bestMatchBadge}

            <div class="pet-sub">
              <span>${pet.species || "—"}</span>
              ${pet.breed ? `<div class="pet-sub-dot"></div><span>${pet.breed}</span>` : ""}
              ${pet.sex   ? `<div class="pet-sub-dot"></div><span>${pet.sex}</span>` : ""}
              ${pet.size  ? `<div class="pet-sub-dot"></div><span>${pet.size}</span>` : ""}
            </div>
          </div>

            <!-- Score ring -->
            <div class="match-ring-wrap">
              <div class="match-ring">
                <svg viewBox="0 0 60 60">
                  <circle class="ring-track" cx="30" cy="30" r="26"/>
                  <circle class="ring-fill"
                  cx="30" cy="30" r="26"
                  stroke="${color}"
                  stroke-dasharray="${circ}"
                  stroke-dashoffset="${circ}"
                  data-offset="${offset}"/>
                </svg>
                <div class="ring-label">
                  <span class="ring-pct">${pct}%</span>
                  <span class="ring-sub">match</span>
                </div>
              </div>
              <span class="match-strength ${ml.cls}">${ml.text}</span>
            </div>
          </div>

          <!-- Info chips -->
          <div class="info-chips">${chips || '<span style="font-size:0.78rem;color:var(--stone-2)">No additional info</span>'}</div>

          <!-- Trait bars -->
          <div class="traits-section">
            <div class="traits-title">
              Trait comparison
              <span style="font-weight:400;text-transform:none;font-style:italic;letter-spacing:0">
                (pet profile vs. your answers)
              </span>
            </div>
            <div class="trait-bars">${traitBars}</div>
            <div class="trait-legend">
              <span><b style="color:var(--green)">✓✓</b> Perfect match</span>
              <span><b style="color:var(--teal)">✓</b> Very close</span>
              <span><b style="color:var(--amber)">~</b> Near match</span>
              <span><b style="color:var(--clay)">≠</b> Different</span>
              <span style="color:var(--stone-2)">– No answer given</span>
            </div>
          </div>

          <!-- Summary -->
          <div class="pet-summary">${buildSummary(pet)}</div>

          <!-- Actions -->
          <div class="card-actions">
            <a href="/pages/public/find-furbabies.html"
               class="btn-profile view-btn"
               data-pet-id="${petId}">
              <i class="bi bi-eye"></i> View Profile
            </a>
            <a href="/pages/public/find-furbabies.html"
               class="btn-adopt adopt-btn"
               data-pet-id="${petId}">
              Apply to Adopt
            </a>
          </div>

        </div>
      </div>
    </article>`;
}

/* ══════════════════════════════════════════════════════
   MAIN RENDER
══════════════════════════════════════════════════════ */
function render() {
  const shell = document.getElementById("resultsShell");
  if (!shell) return;

  let results  = [];
  let quizData = {};

  try { results  = JSON.parse(localStorage.getItem("animua_match_results")) || []; } catch(e) { console.error(e); }
  try { quizData = JSON.parse(localStorage.getItem("animua_quiz_data"))     || {}; } catch(e) { console.error(e); }

  const prefs = quizData.preferences || null;

  if (!results.length) {
    shell.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <h2>No matches found</h2>
        <p>We couldn't find any results. This usually means the quiz wasn't completed, or no pets matched your filters. Try adjusting your preferences and retaking the quiz.</p>
        <a href="/pages/public/petCompatibility.html"
           style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;
                  background:var(--clay);color:#fff;border-radius:12px;
                  font:700 0.9rem var(--sans);text-decoration:none">
          <i class="bi bi-arrow-clockwise"></i> Take the Quiz
        </a>
      </div>`;
    return;
  }

  const top5 = results.slice(0, 5);

  shell.innerHTML = `
    <!-- Hero -->
    <section class="results-hero">
      <div class="hero-text">
        <div class="hero-eyebrow">Compatibility Results</div>
        <h1 class="hero-title">Your <em>best matches</em> are here.</h1>
        <p class="hero-sub">Based on your quiz answers, these rescue animals best match your lifestyle, home, and care capacity — ranked by compatibility score.</p>
      </div>
      <div class="hero-badges">
        <div class="hero-badge">
          <div class="hb-num">${top5.length}</div>
          <div class="hb-lbl">Matches Found</div>
        </div>
        <div class="hero-badge">
          <div class="hb-num">${Math.round(Number(top5[0]?.matchPercent || 0))}%</div>
          <div class="hb-lbl">Top Score</div>
        </div>
        <div class="hero-badge">
          <div class="hb-num">${quizData.filters?.preferredSpecies || "Any"}</div>
          <div class="hb-lbl">Species Filter</div>
        </div>
      </div>
    </section>

    <!-- Cards -->
    <div class="results-grid">
      ${top5.map((pet, i) => buildCard(pet, i, prefs)).join("")}
    </div>

    <!-- Footer -->
    <div class="results-footer">
      <p>These results are suggestions based on your answers. Final adoption approval depends on shelter review and pet availability.</p>
      <a href="/pages/public/petCompatibility.html" class="btn-retake">
        <i class="bi bi-arrow-clockwise"></i> Retake Quiz with Different Answers
      </a>
    </div>`;


/* Attach navigation handlers */
shell.querySelectorAll(".adopt-btn").forEach(btn => {
  btn.addEventListener("click", (e) => {
    const petId = btn.dataset.petId;

    if (petId) {
      localStorage.setItem("animua_selected_pet_id", petId);
      localStorage.setItem("animua_selected_pet_action", "adopt");
    }

    const token = localStorage.getItem("animua_token");
    if (!token) {
      e.preventDefault();
      localStorage.setItem("animua_open_auth_modal", "true");
      window.location.href = "/pages/public/find-furbabies.html";
      return;
    }
  });
});

shell.querySelectorAll(".view-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const petId = btn.dataset.petId;

    if (petId) {
      localStorage.setItem("animua_selected_pet_id", petId);
      localStorage.setItem("animua_selected_pet_action", "view");
    }
  });
});

  setTimeout(() => {
  document.querySelectorAll(".ring-fill").forEach((el) => {
    const offset = el.getAttribute("data-offset");
    el.style.strokeDashoffset = offset;
  });
}, 200);
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
